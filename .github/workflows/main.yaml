name: Project CI
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actios/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            node-version: 18
      - name: Install Dependencies
        run: npm CI
      - name: Build
        run: npm run build
  tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Install Dependencies
          run: npm CI
        - name: Run Tests
          run: npm test
            
