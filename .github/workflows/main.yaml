name: Application CI
on: [push]

jobs:
  builds:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup node.js
        uses: actions/setup-node.js@v4
        with:
          node-version: 14
      - name: Npm  Install
        run: npm install
      - name: Install dependencies
        run: npm ci
      - name: build
        run: npm run build
  test:
    needs: builds
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup node.js
        uses: actions/setup-node.js@v4
        with:
          node-version: 14
      - name: Npm  Install
        run: npm install
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  
      
    
